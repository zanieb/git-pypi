# Build Git binaries for all platforms.
name: "Build binaries"

on:
  workflow_call:
    inputs:
      git-version:
        description: "Git version to build"
        required: true
        type: string
      git-source-ref:
        description: "Git source ref or full commit to build instead of the release tarball (macOS/Linux only)"
        required: false
        type: string
        default: ""
      git-source-name:
        description: "Display name for the Git source in matrix job names"
        required: true
        type: string

permissions: {}

jobs:
  resolve-git-source:
    name: "resolve git source"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      git-commit: ${{ steps.resolve.outputs.git-commit }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: "Resolve Git source ref"
        id: resolve
        env:
          GIT_SOURCE_REF: ${{ inputs.git-source-ref }}
          GIT_VERSION: ${{ inputs.git-version }}
        run: |
          if [[ ! "$GIT_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "::error::Git version contains unsupported characters"
            exit 1
          fi

          if [ -z "$GIT_SOURCE_REF" ]; then
            echo "Using the Git $GIT_VERSION release tarball"
            echo "git-commit=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git_commit=$(./build/resolve_git_ref.sh "$GIT_SOURCE_REF")
          echo "Resolved Git source ref $GIT_SOURCE_REF to $git_commit"
          echo "git-commit=$git_commit" >> "$GITHUB_OUTPUT"

  build-linux:
    name: "linux on ${{ matrix.arch }} / ${{ inputs.git-source-name }}"
    needs: resolve-git-source
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: linux_x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: linux_aarch64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: "Build Git in Docker"
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: build/linux/Dockerfile
          build-args: |
            GIT_VERSION=${{ inputs.git-version }}
            GIT_COMMIT=${{ needs.resolve-git-source.outputs.git-commit }}
          tags: git-builder-${{ matrix.arch }}
          load: true
          cache-from: type=gha,scope=git-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=git-${{ matrix.arch }}

      - name: "Extract binaries"
        run: |
          mkdir -p build/output/${{ matrix.target }}
          docker run --rm \
            -v ${{ github.workspace }}/build/output/${{ matrix.target }}:/output \
            git-builder-${{ matrix.arch }}

      - name: "Verify build"
        run: |
          ls -la build/output/${{ matrix.target }}/
          file build/output/${{ matrix.target }}/bin/git

      - name: "Create tarball"
        run: |
          tar -cvf git-${{ matrix.target }}.tar -C build/output/${{ matrix.target }} .

      - name: "Upload binaries"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-${{ matrix.target }}
          path: git-${{ matrix.target }}.tar
          if-no-files-found: error

  build-macos:
    name: "macos on ${{ matrix.arch }} / ${{ inputs.git-source-name }}"
    needs: resolve-git-source
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            target: macos_arm64
          - arch: x86_64
            runner: macos-15-intel
            target: macos_x86_64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.11.18"

      - name: "Build Git"
        env:
          GIT_COMMIT: ${{ needs.resolve-git-source.outputs.git-commit }}
          GIT_VERSION: ${{ inputs.git-version }}
        run: |
          chmod +x build/macos/build.sh
          ./build/macos/build.sh \
            "$GIT_VERSION" \
            ${{ matrix.arch }} \
            "$GIT_COMMIT"

      - name: "Verify build"
        run: |
          ls -la build/output/${{ matrix.target }}/
          build/output/${{ matrix.target }}/bin/git --version

      - name: "Create tarball"
        run: |
          tar -cvf git-${{ matrix.target }}.tar -C build/output/${{ matrix.target }} .

      - name: "Upload binaries"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-${{ matrix.target }}
          path: git-${{ matrix.target }}.tar
          if-no-files-found: error
