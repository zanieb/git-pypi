# Build Python wheels from Git binaries.
name: "Build wheels"

on:
  workflow_call:
    inputs:
      commit:
        description: "Repository commit containing the wheel sources"
        required: true
        type: string
      git-version:
        description: "Git version"
        required: true
        type: string
      build:
        description: "Build date as YYYYMMDD (default: today)"
        required: false
        type: string
        default: ""
      run-id:
        description: "CI run ID to download binaries from (if not provided, uses current run's artifacts)"
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  build-macos-wheels:
    name: "macos wheels on ${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            target: macos_arm64
          - arch: x86_64
            runner: macos-15-intel
            target: macos_x86_64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: "Download binary artifacts (from current run)"
        if: ${{ !inputs.run-id }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: binaries-${{ matrix.target }}
          path: build/output/

      - name: "Download binary artifacts (from CI run)"
        if: ${{ inputs.run-id }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.run-id }}
          TARGET: ${{ matrix.target }}
        run: |
          gh run download "$RUN_ID" --repo "$REPOSITORY" --name "binaries-$TARGET" --dir build/output/

      - name: "Extract tarball"
        run: |
          cd build/output
          mkdir -p ${{ matrix.target }}
          tar -xvf ./*.tar -C ${{ matrix.target }}
          rm -f ./*.tar
          ls -la ${{ matrix.target }}/

      - name: "Show library dependencies before delocate"
        run: |
          echo "=== Main git binary ==="
          otool -L build/output/${{ matrix.target }}/bin/git
          echo ""
          echo "=== git-remote-https ==="
          otool -L build/output/${{ matrix.target }}/libexec/git-core/git-remote-https || true

      - name: "Build wheel"
        env:
          BUILD: ${{ inputs.build }}
          GIT_VERSION: ${{ inputs.git-version }}
          TARGET: ${{ matrix.target }}
        run: |
          build_args=()
          if [ -n "$BUILD" ]; then
            build_args=(--build "$BUILD")
          fi
          uv run make_wheels.py \
            --version "$GIT_VERSION" \
            "${build_args[@]}" \
            --binary-dir build/output \
            --platform "$TARGET"

      - name: "Verify no non-system library dependencies"
        run: python scripts/check_macos_wheel.py dist/*.whl

      - name: "Upload wheel"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  build-linux-wheels:
    name: "linux wheels"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: "Download binary artifacts (from current run)"
        if: ${{ !inputs.run-id }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: build/output/
          pattern: binaries-linux_*
          merge-multiple: false

      - name: "Download binary artifacts (from CI run)"
        if: ${{ inputs.run-id }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.run-id }}
        run: |
          gh run download "$RUN_ID" --repo "$REPOSITORY" --pattern 'binaries-linux_*' --dir build/output/

      - name: "Extract tarballs"
        run: |
          cd build/output
          for dir in binaries-*; do
            platform="${dir#binaries-}"
            mkdir -p "$platform"
            tar -xvf "$dir"/*.tar -C "$platform"
            rm -rf "$dir"
          done
          ls -la

      - name: "Build Linux wheels"
        env:
          BUILD: ${{ inputs.build }}
          GIT_VERSION: ${{ inputs.git-version }}
        run: |
          build_args=()
          if [ -n "$BUILD" ]; then
            build_args=(--build "$BUILD")
          fi
          uv run make_wheels.py \
            --version "$GIT_VERSION" \
            "${build_args[@]}" \
            --binary-dir build/output \
            --platform linux_x86_64 \
            --platform linux_aarch64

      - name: "Upload wheels"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-linux
          path: dist/*.whl
          if-no-files-found: error

  build-windows-wheels:
    name: "windows wheels"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          ref: ${{ inputs.commit }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: "Build Windows wheels"
        env:
          BUILD: ${{ inputs.build }}
          GIT_VERSION: ${{ inputs.git-version }}
        run: |
          build_args=()
          if [ -n "$BUILD" ]; then
            build_args=(--build "$BUILD")
          fi
          uv run make_wheels.py \
            --version "$GIT_VERSION" \
            "${build_args[@]}" \
            --platform win_amd64 \
            --platform win_arm64 \
            --platform win32

      - name: "Upload wheels"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-windows
          path: dist/*.whl
          if-no-files-found: error

  merge-wheels:
    name: "merge all wheels"
    runs-on: ubuntu-latest
    needs: [build-macos-wheels, build-linux-wheels, build-windows-wheels]
    steps:
      - name: "Download all wheel artifacts"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: wheels/
          pattern: wheel*
          merge-multiple: true

      - name: "List all wheels"
        run: |
          ls -la wheels/
          echo ""
          echo "=== SHA256 checksums ==="
          for wheel in wheels/*.whl; do
            shasum -a 256 "$wheel"
          done

      - name: "Upload merged wheels"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels
          path: wheels/*.whl
          if-no-files-found: error
