# Build upstream Git HEAD regularly and when the build job changes.
name: "CI"

on:
  schedule:
    - cron: "17 5 * * *"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-git-head.yml"
      - ".github/workflows/build-binaries.yml"
      - "build/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-git-head-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build-binaries:
    name: "build-binaries"
    uses: ./.github/workflows/build-binaries.yml
    with:
      git-version: HEAD
      git-source-ref: HEAD
      git-source-name: HEAD
