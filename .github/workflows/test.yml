# Test Git wheels on each platform.
name: "Test"

on:
  workflow_call:

jobs:
  test:
    name: "${{ matrix.name }}"
    runs-on: ${{ matrix.runner }}
    env:
      UV_MANAGED_PYTHON: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manylinux_x86_64
            runner: ubuntu-latest
            wheel_pattern: "*manylinux*x86_64*.whl"
            python: "3.12"
          - name: manylinux_aarch64
            runner: ubuntu-24.04-arm
            wheel_pattern: "*manylinux*aarch64*.whl"
            python: "3.12"
          - name: macosx_arm64
            runner: macos-latest
            wheel_pattern: "*macosx*arm64*.whl"
            python: "3.12"
          - name: macosx_x86_64
            runner: macos-15-intel
            wheel_pattern: "*macosx*x86_64*.whl"
            python: "3.12"
          - name: win_amd64
            runner: windows-latest
            wheel_pattern: "*win_amd64*.whl"
            python: "cpython-3.12-windows-x86_64-none"
          - name: win_arm64
            runner: windows-11-arm
            wheel_pattern: "*win_arm64*.whl"
            python: "cpython-3.12-windows-aarch64-none"
          - name: win32
            runner: windows-latest
            wheel_pattern: "*win32*.whl"
            python: "cpython-3.12-windows-x86-none"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: "Download wheels"
        uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist/

      - name: "Install wheel and run tests"
        shell: bash
        run: |
          wheel=$(ls dist/${{ matrix.wheel_pattern }} | head -1)
          echo "Testing: $wheel"

          # Create a synchronized project environment with uv-managed Python
          uv sync --locked --python "${{ matrix.python }}"
          # Exercise pip's handling of executable permissions on Unix too.
          if [ "${{ matrix.name }}" = "manylinux_x86_64" ]; then
            uv run --no-sync python -m ensurepip
            uv run --no-sync python -m pip install --no-index "$wheel"
          else
            uv pip install "$wheel"
          fi

          # Get the git binary path from the installed package
          git_bin=$(uv run --no-sync python -c "import python_git_bin; print(python_git_bin.GIT_EXE)")
          echo "Git binary: $git_bin"

          # Run tests
          uv run --no-sync python -m pytest test/ --git-bin "$git_bin" -v
