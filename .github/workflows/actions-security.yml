name: "Actions security"

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
      - "action.yml"
      - "action.yaml"
      - "zizmor.yaml"
      - "zizmor.yml"
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
      - "action.yml"
      - "action.yaml"
      - "zizmor.yaml"
      - "zizmor.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: "zizmor"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: "Audit actions"
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
          min-severity: low
          persona: regular
          version: v1.32.0
